<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM Model Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: absolute;
            background: linear-gradient(to bottom, #1e1e2e, #302b63);
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            z-index: 100;
        }
        #twitch-chat-container {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 300px;
            max-height: 400px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            color: white;
            font-family: Arial, sans-serif;
            padding: 10px;
            overflow-y: auto;
            z-index: 1000;
        }
        #twitch-chat-messages {
            display: flex;
            flex-direction: column;
        }
        #twitch-chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        #twitch-chat-title {
            font-weight: bold;
        }
        #twitch-chat-toggle {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>

    <div id="twitch-chat-container">
        <div id="twitch-chat-header">
            <div id="twitch-chat-title">Twitch Chat</div>
            <button id="twitch-chat-toggle">-</button>
        </div>
        <div id="twitch-chat-messages"></div>
    </div>

    <!-- The script will be injected by webpack -->
</body>
</html>
