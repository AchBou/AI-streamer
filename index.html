<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM Model Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: absolute;
            background: linear-gradient(to bottom, #1e1e2e, #302b63);
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            z-index: 100;
        }

        #controls-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group h3 {
            margin: 0;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        .buttons-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background-color: #4a4a6a;
            color: white;
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #6a6a8a;
        }

        button.active {
            background-color: #8a6aff;
        }

        .info-text {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #666;
            font-style: italic;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="loading">Loading...</div>

    <div id="controls-container">
        <div class="control-group">
            <h3>Expressions</h3>
            <div class="buttons-row">
                <button id="expression-neutral">Neutral</button>
                <button id="expression-happy">Happy</button>
                <button id="expression-angry">Angry</button>
                <button id="expression-sad">Sad</button>
                <button id="expression-surprised">Surprised</button>
                <button id="expression-relaxed">Relaxed</button>
            </div>
        </div>

        <div class="control-group">
            <h3>Poses</h3>
            <div class="buttons-row">
                <button id="pose-tpose">T-Pose</button>
                <button id="pose-wave">Wave</button>
                <button id="pose-bow">Bow</button>
                <button id="pose-jump">Jump</button>
                <button id="pose-dance">Dance</button>
            </div>
        </div>

        <div class="control-group">
            <h3>Animations</h3>
            <div class="buttons-row">
                <button id="animation-idle">Idle</button>
                <button id="animation-walk">Walk</button>
                <button id="animation-run">Run</button>
                <button id="animation-stop">Stop</button>
            </div>
        </div>

        <div class="control-group">
            <h3>Models</h3>
            <div class="buttons-row" id="model-buttons">
                <button id="model-model1">Model 1</button>
                <!-- More model buttons will be added dynamically if needed -->
            </div>
        </div>

        <div class="control-group">
            <h3>FBX Animations</h3>
            <div class="buttons-row" id="fbx-buttons">
                <!-- FBX animation buttons will be added dynamically -->
                <div class="info-text">Drop FBX files in the animations folder and restart the app to see them here</div>
            </div>
        </div>

        <div class="control-group">
            <h3>Reset</h3>
            <div class="buttons-row">
                <button id="reset-all">Reset All</button>
            </div>
        </div>
    </div>

    <!-- The script will be injected by webpack -->
</body>
</html>
